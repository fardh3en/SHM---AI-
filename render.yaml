services:
  - type: web
    name: infralytiq
    runtime: python
    buildCommand: "pip install -r requirements.txt && python scripts/download_weights.py --yes"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: INFERENCE_DEVICE
        value: cpu
